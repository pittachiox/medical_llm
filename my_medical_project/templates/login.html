{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">เข้าสู่ระบบ 🔐</h2>
    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label class="block text-gray-700 mb-2">ชื่อผู้ใช้</label>
            <input type="text" name="username" required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-gray-700 mb-2">รหัสผ่าน</label>
            <input type="password" name="password" required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">เข้าสู่ระบบ</button>
    </form>
    <p class="mt-4 text-center text-gray-600">ยังไม่มีบัญชี? <a href="/register"
            class="text-blue-600 hover:underline">สมัครสมาชิกที่นี่</a></p>
</div>
{% endblock %}
