{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">สร้างบัญชีผู้ใช้ใหม่ 📝</h2>
    <form method="POST" action="/register" class="space-y-4">
        <div>
            <label class="block text-gray-700 mb-2">ตั้งชื่อผู้ใช้</label>
            <input type="text" name="username" required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-gray-700 mb-2">ตั้งรหัสผ่าน</label>
            <input type="password" name="password" required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
            class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition">สมัครสมาชิก</button>
    </form>
    <p class="mt-4 text-center text-gray-600">มีบัญชีอยู่แล้ว? <a href="/login"
            class="text-blue-600 hover:underline">เข้าสู่ระบบเลย</a></p>
</div>
{% endblock %}
