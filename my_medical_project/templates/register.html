<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Register - Smart Medical AI</title>
    <!-- BEGIN: Tailwind CSS Integration -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- END: Tailwind CSS Integration -->
    <!-- Link to Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body class="flex items-center justify-center p-4 auth-bg text-gray-800">
    <!-- BEGIN: Registration Container -->
    <main class="w-full max-auto max-w-md" data-purpose="registration-card-container">
        <div class="auth-glass-effect rounded-2xl shadow-2xl p-8 md:p-10">
            <!-- BEGIN: Header Section -->
            <header class="text-center mb-8" data-purpose="branding-header">
                <div
                    class="inline-flex items-center justify-center w-16 h-16 bg-medical-600 rounded-xl mb-4 shadow-lg shadow-medical-600/20">
                    <!-- Medical Cross Icon -->
                    <svg class="h-10 w-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-medical-900 tracking-tight">Smart Medical AI</h1>
                <p class="text-gray-500 mt-2">Create Your Account</p>
            </header>
            <!-- END: Header Section -->

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-6">
                {% for category, message in messages %}
                <div
                    class="p-4 mb-2 rounded-lg text-sm font-medium {% if category == 'error' %}bg-red-50 text-red-600 border border-red-100{% else %}bg-green-50 text-green-600 border border-green-100{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <!-- BEGIN: Registration Form -->
            <form action="/register" class="space-y-5" data-purpose="registration-form" method="POST">
                <!-- Username Field -->
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-700" for="username">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <input
                            class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-medical-600 focus:border-medical-600 transition-colors"
                            id="username" name="username" placeholder="johndoe" required="" type="text" />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-700" for="password">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <input
                            class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-medical-600 focus:border-medical-600 transition-colors"
                            id="password" name="password" placeholder="••••••••" required="" type="password" />
                    </div>
                </div>

                <!-- Terms and Conditions Placeholder -->
                <div class="flex items-center">
                    <input class="h-4 w-4 text-medical-600 focus:ring-medical-600 border-gray-300 rounded" id="terms"
                        name="terms" required="" type="checkbox" />
                    <label class="ml-2 block text-sm text-gray-700" for="terms">
                        I agree to the <a class="text-medical-600 hover:underline" href="#">Terms &amp; Conditions</a>
                    </label>
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-medical-600 hover:bg-medical-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-medical-600 transition-all transform hover:scale-[1.01]"
                    type="submit">
                    Register
                </button>
            </form>
            <!-- END: Registration Form -->
            <!-- BEGIN: Footer Links -->
            <footer class="mt-8 text-center" data-purpose="form-footer">
                <p class="text-sm text-gray-600">
                    Already have an account?
                    <a class="font-medium text-medical-600 hover:text-medical-700 hover:underline ml-1" href="/login">
                        Login here
                    </a>
                </p>
            </footer>
            <!-- END: Footer Links -->
        </div>
        <!-- BEGIN: Trust Badges / Support -->
        <div class="mt-6 flex justify-center space-x-4 text-xs text-gray-400" data-purpose="trust-badges">
            <div class="flex items-center">
                <svg class="h-3 w-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path clip-rule="evenodd"
                        d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                        fill-rule="evenodd"></path>
                </svg>
                HIPAA Compliant
            </div>
            <div class="flex items-center">
                <svg class="h-3 w-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
                    <path clip-rule="evenodd"
                        d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z"
                        fill-rule="evenodd"></path>
                </svg>
                Secure Data Encryption
            </div>
        </div>
        <!-- END: Trust Badges / Support -->
    </main>
    <!-- END: Registration Container -->
</body>

</html>
